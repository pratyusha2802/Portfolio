version: 2
updates:
  # npm dependencies — PRs land on dev, never master directly.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keep GitHub Actions versions (checkout, setup-node, deploy-pages, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
